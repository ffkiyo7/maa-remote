# 只放开发工具配置，没有 [project]：运行脚本仍是纯标准库，部署时平铺拷到 ~/.hermes/scripts/。
# 版本固定，跑法见 docs/DEV_GUIDE.md「静态检查」：
#   uvx ruff@0.17.3 check
#   uvx pyright@1.1.414

[tool.ruff]
target-version = "py311"
include = ["scripts/*.py", "deploy.py", "tests/*.py"]

[tool.ruff.lint]
# E4/E7/E9：import、语句、语法类错误；F：pyflakes；BLE：裸 except Exception。不开 E501（行宽）。
select = ["E4", "E7", "E9", "F", "BLE"]

[tool.pyright]
include = ["scripts", "deploy.py", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
extraPaths = ["scripts", "tests"]
# 测试里 `ledger["stages"]` / `result["x"]` / `found.endswith(...)` 这种访问本身就是断言：
# 键不在 → KeyError、值是 None → TypeError / AttributeError，用例当场红，正是想要的效果。
# 所以只在 tests/ 关掉「TypedDict 键可能不存在」和「可能是 None」这三条；scripts/ 照常全开。
executionEnvironments = [
  { root = "tests", extraPaths = [".", "scripts", "tests"], reportTypedDictNotRequiredAccess = "none", reportOptionalSubscript = "none", reportOptionalMemberAccess = "none" },
  { root = "." },
]
